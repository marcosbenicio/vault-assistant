# ==============================================================================
# Vault Assistant stack
# ==============================================================================
# Self-contained: search engine, database, dashboards, the app and a Jupyter
# service for development and evaluation notebooks. App and notebook share
# the same image; only the command differs.
#
# Requires a .env file (see .env.example). Without VAULT_PATH it runs against
# the committed demo_vault, so a fresh clone works out of the box.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # elasticsearch - retrieval engine: BM25 text search + dense_vector kNN,
  # fused with reciprocal rank fusion in the app.
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
    container_name: assistant_es
    restart: unless-stopped
    mem_limit: 2g
    environment:
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"       # a personal vault fits in 1 GB heap
      discovery.type: single-node
      xpack.security.enabled: "false"     # local use only
    ports:
      - "${ES_PORT:-9200}:9200"
    healthcheck:
      # started is not ready: the one-shot ingest waits for this check,
      # because elasticsearch takes ~30s to answer after boot
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q status"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - assistant-net

  # ----------------------------------------------------------------------------
  # postgres - conversation and feedback log. Born with the right database,
  # so setup is just docker compose up + make init-db.
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:18
    container_name: assistant_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: obsidian_assistant
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pswd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql        # pg18+ mount convention
    networks:
      - assistant-net

  # ----------------------------------------------------------------------------
  # grafana - operational dashboard reading straight from postgres.
  # Datasource and dashboards are provisioned from the repo.
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana
    container_name: assistant_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - postgres
    networks:
      - assistant-net

  # ----------------------------------------------------------------------------
  # app - Streamlit UI. The vault is mounted read-only: the assistant reads
  # notes, it never touches them. The package is bind-mounted so code edits
  # apply without rebuilding the image.
  # ----------------------------------------------------------------------------
  app:
    build: .
    container_name: assistant_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8501}:8501"
    environment: &app-env
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELASTIC_HOST: "http://elasticsearch:9200"
      POSTGRES_HOST: "postgres"
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pswd}
      APP_POSTGRES_DB: "obsidian_assistant"
      VAULT_PATH: "/vault"
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-all-MiniLM-L6-v2}
      ES_INDEX: ${ES_INDEX:-obsidian_notes}
    volumes:
      - ./assistant:/app
      - ${VAULT_PATH:-./demo_vault}:/vault:ro
      - hf_cache:/root/.cache/huggingface   # embedding model, downloaded once
    depends_on:
      - elasticsearch
      - postgres
    networks:
      - assistant-net

  # ----------------------------------------------------------------------------
  # ingest - one-shot: same image as the app, but the command runs the
  # __main__ block of ingest.py instead of streamlit. It waits for
  # elasticsearch to be healthy, indexes whatever is mounted at /vault
  # (the user's vault via VAULT_PATH, or the committed demo_vault), then
  # exits. Deterministic ids make reruns idempotent, so the stack can
  # rebuild the index on every up. Rerun anytime: make ingest
  # ----------------------------------------------------------------------------
  ingest:
    build: .
    container_name: assistant_ingest
    command: python ingest.py
    restart: "no"
    environment: *app-env
    volumes:
      - ./assistant:/app
      - ${VAULT_PATH:-./demo_vault}:/vault:ro
      - hf_cache:/root/.cache/huggingface   # embedding model, downloaded once
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - assistant-net

  # ----------------------------------------------------------------------------
  # notebook - Jupyter Lab on the same image, for development and the
  # evaluation notebooks. Mounts the whole repo, so notebooks/, data/ and
  # the package are all editable and importable.
  # ----------------------------------------------------------------------------
  notebook:
    build: .
    container_name: assistant_notebook
    restart: unless-stopped
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.root_dir=/project
      --IdentityProvider.token=${JUPYTER_TOKEN:-dev}
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment: *app-env
    volumes:
      - .:/project
      - ${VAULT_PATH:-./demo_vault}:/vault:ro
      - hf_cache:/root/.cache/huggingface   # embedding model, downloaded once
    depends_on:
      - elasticsearch
      - postgres
    networks:
      - assistant-net

  # ----------------------------------------------------------------------------
  # ollama - the local LLM, part of the default stack. On first start it
  # pulls a basic model (qwen2.5:1.5b, ~1 GB) so the app always has a
  # local option; better models are downloaded from the app's sidebar
  # (Local models). The pull is idempotent: later starts see the model
  # in the volume and skip it. NVIDIA gpu (optional):
  #   cp docker-compose.gpu.yml docker-compose.override.yml && docker compose up -d
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama
    container_name: assistant_ollama
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 3; ollama pull qwen2.5:1.5b; wait"]
    environment:
      OLLAMA_CONTEXT_LENGTH: 8192
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_KEEP_ALIVE: -1
      # one resident model at a time: switching evicts the previous one,
      # so the active model always gets the whole gpu (or all the ram)
      OLLAMA_MAX_LOADED_MODELS: 1

    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - assistant-net

networks:
  assistant-net:
    driver: bridge

volumes:
  es_data:
  pg_data:
  grafana_data:
  ollama_data:
  hf_cache:        # sentence-transformers weights, shared by app/notebook/ingest
