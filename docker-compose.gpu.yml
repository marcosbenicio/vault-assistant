# Optional GPU override for machines with an NVIDIA card and the
# nvidia-container-toolkit. The base compose stays CPU-only so the
# project runs anywhere; this file adds acceleration where available.
# Activate it the same way .env.example becomes .env:
#
#   cp docker-compose.gpu.yml docker-compose.override.yml
#   docker compose up -d
#
# (docker compose merges docker-compose.override.yml automatically; the
# override is gitignored, personal hardware config never gets committed.)

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
